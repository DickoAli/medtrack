<!DOCTYPE html>
<html>
<head><title>Générer icônes MedTrack</title></head>
<body>
<script>
function createIcon(size) {
  const canvas = document.createElement('canvas')
  canvas.width = size
  canvas.height = size
  const ctx = canvas.getContext('2d')

  // Fond bleu marine
  ctx.fillStyle = '#0B1F3A'
  ctx.beginPath()
  ctx.roundRect(0, 0, size, size, size * 0.2)
  ctx.fill()

  const cx = size / 2
  const cy = size / 2
  const arm = size * 0.12
  const len = size * 0.55

  // Croix médicale teal
  ctx.fillStyle = '#00C9B1'
  ctx.fillRect(cx - arm, cy - len/2, arm*2, len)
  ctx.fillRect(cx - len/2, cy - arm, len, arm*2)

  // Cercle blanc au centre
  ctx.fillStyle = '#0B1F3A'
  ctx.beginPath()
  ctx.arc(cx, cy, size * 0.13, 0, Math.PI * 2)
  ctx.fill()

  // Lettre M
  ctx.fillStyle = '#00C9B1'
  ctx.font = `bold ${size * 0.18}px Arial Black`
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'
  ctx.fillText('M', cx, cy + size * 0.01)

  return canvas.toDataURL('image/png')
}

// Générer et télécharger les icônes
[192, 512, 180].forEach(size => {
  const url = createIcon(size)
  const a = document.createElement('a')
  a.href = url
  a.download = size === 180 ? 'apple-touch-icon.png' : `icon-${size}.png`
  document.body.appendChild(a)
  a.click()
})

document.body.innerHTML = '<h2>✅ Icônes générées ! Mets-les dans le dossier public/</h2>'
</script>
</body>
</html>
